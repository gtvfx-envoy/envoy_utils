site_name: Envoy Utils
site_url: https://gtvfx-envoy.github.io/envoy_utils/
site_description: Git, release, and publishing tools for Envoy bundles and stacks.
repo_name: gtvfx-envoy/envoy_utils
repo_url: https://github.com/gtvfx-envoy/envoy_utils
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - CLI Reference:
      - engit: cli-reference/engit.md
  - Troubleshooting: troubleshooting.md
  - Maintainer Release Guide: https://gtvfx-envoy.github.io/envoy/maintainers/releasing/
  - Rust API: https://gtvfx-envoy.github.io/envoy_utils/rustdoc/engit_core/
