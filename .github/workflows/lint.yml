name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"

      - name: Install documentation tooling
        run: python -m pip install -r docs/requirements.txt

      - name: Build ProperDocs site
        run: python -m properdocs build --clean --strict

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Cheap, fast sanity check before the expensive fmt/clippy/test
      # steps: catches an `engit dev link rust` accidentally left linked
      # (a local `path =` dependency) instead of the published git+tag pin.
      - name: Verify envoy-core is not a local dev-link
        shell: bash
        run: |
          if grep -q 'envoy-core = { path' rust/Cargo.toml; then
            echo "::error::rust/Cargo.toml's envoy-core dependency is a local path dependency (left over from 'engit dev link rust'). Run 'engit dev unlink rust' before committing." >&2
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # fmt / clippy / tests are three *independent* checks. Without the
      # `!cancelled()` guards below, a step's default condition is "all
      # previous steps succeeded", so a trivial formatting failure
      # short-circuits the job before Clippy and the tests ever run --
      # hiding real compile errors and test failures until someone happens
      # to run them locally. `!cancelled()` (rather than `always()`) still
      # lets an explicit workflow cancellation stop the job promptly.
      - name: Check formatting
        id: fmt
        working-directory: rust
        continue-on-error: true
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        working-directory: rust
        run: cargo test --workspace

      - name: Fail if formatting failed
        if: ${{ !cancelled() && steps.fmt.outcome == 'failure' }}
        run: exit 1
