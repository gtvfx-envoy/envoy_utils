[package]
name = "engit-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native engit CLI (git/GitHub tooling for envoy bundles). No Python API."
publish = false

[[bin]]
name = "engit"
path = "src/main.rs"

[dependencies]
engit-core = { path = "../engit-core" }
clap.workspace = true

[dev-dependencies]
assert_cmd = "2"
flate2 = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
