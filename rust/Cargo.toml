[workspace]
resolver = "2"
members = [
    "engit-core",
    "engit-cli",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/gtvfx-envoy/envoy_utils"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
envoy-core = { git = "https://github.com/gtvfx-envoy/envoy", tag = "v0.6.2", version = "=0.6.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
